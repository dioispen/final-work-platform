{% extends "base.html" %}

{% block title %}提交評價{% endblock %}

{% block content %}
<div class="card">
    <h2>專案評價</h2>

    <p><strong>專案名稱：</strong>{{ project.title }}</p>

    <form method="post">
        <input type="hidden" name="target_id" value="{{ target_id }}">

        <div class="form-group">
            <label>評分一（1–5）</label>
            <input type="number" name="dim1" min="1" max="5" required>
        </div>

        <div class="form-group">
            <label>評分二（1–5）</label>
            <input type="number" name="dim2" min="1" max="5" required>
        </div>

        <div class="form-group">
            <label>評分三（1–5）</label>
            <input type="number" name="dim3" min="1" max="5" required>
        </div>

        <div class="form-group">
            <label>整體評論</label>
            <textarea name="comment" rows="4"></textarea>
        </div>

        <button type="submit" class="btn">送出評價</button>
        <a href="/" class="btn" style="background:#999;">取消</a>
    </form>
</div>
{% endblock %}
